name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect shell scripts
        run: |
          { git ls-files '*.sh'
            git ls-files bin/ | while read -r f; do
              head -1 "$f" | grep -ql bash && echo "$f" || true
            done
          } | sort -u > /tmp/shell_files.txt
          wc -l < /tmp/shell_files.txt

      - name: bash -n
        run: |
          rc=0
          while read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; rc=1; }
          done < /tmp/shell_files.txt
          exit "$rc"

      - name: shellcheck
        run: xargs -a /tmp/shell_files.txt shellcheck --severity=error

      - name: Migration filenames
        run: |
          rc=0
          for f in migrations/*; do
            basename "$f" | grep -qE '^[0-9]{10}\.sh$' || { echo "BAD MIGRATION NAME: $f"; rc=1; }
          done
          exit "$rc"

      - name: Config template parses
        run: bash -n templates/makaron.conf.default
